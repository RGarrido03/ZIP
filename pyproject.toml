[project]
name = "zip"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "einops>=0.8.2",
    "mamba-ssm>=2.3.2.post1",
    "matplotlib>=3.10.9",
    "numpy>=2.4.6",
    "onnx>=1.22.0",
    "onnxruntime>=1.27.0",
    "onnxscript>=0.7.1",
    "peft>=0.19.1",
    "pillow>=12.2.0",
    "pyturbojpeg>=2.2.0",
    "pyyaml>=6.0.3",
    "scipy>=1.17.1",
    "tensorboardx>=2.6.5",
    "timm>=1.0.27",
    "torch>=2.12.0",
    "torchvision>=0.27.0",
    "tqdm>=4.67.3",
    "wandb>=0.19.0",
]

[project.optional-dependencies]
test = ["pytest>=9"]

[tool.uv.extra-build-dependencies]
mamba-ssm = ["torch"]

[dependency-groups]
dev = [
    "ruff>=0.15.17",
    "ty>=0.0.49",
]
